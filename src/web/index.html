<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hemochekonomi</title>
    <!-- tema.css först: style.css läser dess tokens och innehåller själv ingen
         hexkod. Ordningen är inte likgiltig — en regel i style.css som läser
         var(--bakgrund) behöver tokenen deklarerad, och det mörka läget bor i
         tema.css. -->
    <link rel="stylesheet" href="/tema.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Hemochekonomi</h1>
      <p class="lead">Månadens inkomster, utgifter och sparande.</p>
    </header>

    <main>
      <!-- Sidan har två tillstånd och ingen router: app.js frågar GET /api/mig
           vid laddningen och visar inloggningsvyn vid 401, månadsvyn vid 200.
           Inget annat avgör vilken vy som syns. Båda vyerna står i samma fil och
           döljs med hidden, som app.js sätter. -->
      <section class="card" id="login-view">
        <h2>Logga in</h2>

        <!-- Steg ett: e-postadressen. Steg två ersätter det när koden är
             skickad; app.js sätter hidden på de två blocken. -->
        <div id="login-step-email">
          <div class="field">
            <label for="login-email">E-postadress</label>
            <input id="login-email" name="email" type="email" inputmode="email" autocomplete="email" />
          </div>
          <button type="button" class="primary" id="send-code">Skicka kod</button>
        </div>

        <!-- Steg två: koden. inputmode="numeric" ger sifferbord på mobilen och
             autocomplete="one-time-code" låter telefonen fylla i koden. -->
        <div id="login-step-code" hidden>
          <p class="lead" id="code-sent"></p>
          <div class="field">
            <label for="login-code">Kod</label>
            <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
          </div>
          <button type="button" class="primary" id="log-in">Logga in</button>
          <button type="button" class="secondary" id="use-other-email">Använd en annan adress</button>
        </div>

        <!-- Serverns text ordagrant vid 400 och 429 — aldrig en egen. -->
        <p class="form-error" id="login-error" role="alert"></p>
      </section>

      <section id="month-view" hidden>
        <!-- Sidomenyn: loggan överst, vem som är inloggad och vägen ut.
             Adressen står bredvid knappen: två som delar dator ska kunna se vems
             budget som visas. Texten skrivs av app.js ur GET /api/mig.
             Loggan är användarens egen bild, beskuren till motivet och nedskalad:
             480 gånger 261 bildpunkter. Originalet logga.png har motivet i bara
             26,3 procent av ytan, så en obeskuren bild skalar med sin tomma yta
             och märket blir litet i en rad med begränsad höjd.
             width och height står som attribut i bildens egen storlek, så att
             raden inte hoppar medan bilden laddas; visningsstorleken sätts i
             style.css. alt är tomt därför att namnet står som text intill: en
             skärmläsare som läser båda skulle säga samma sak två gånger.
             På mobil är menyn en rad överst, vid 60rem en spalt till vänster;
             vilket av dem som gäller är style.css:s sak. -->
        <aside class="sidomeny">
          <div class="sidomeny-marke">
            <img
              class="sidomeny-logga"
              src="/bilder/logga-liten.png"
              alt=""
              width="480"
              height="261"
              decoding="async"
            />
            <span class="sidomeny-namn">Hem och Ekonomi</span>
          </div>
          <span id="user-email"></span>
          <button type="button" class="secondary" id="log-out">Logga ut</button>
        </aside>

        <!-- Allt utom sidomenyn ligger i en egen kolumn, så att sidomenyn kan bli
             en spalt vid sidan utan att varje kort blir ett eget rutnätsbarn. -->
        <div class="month-content">
          <!-- Månadsväljaren ligger överst: bakåt, månadens namn, framåt. Namnet
               skrivs av app.js ur monthLabel i src/core/dates.js. -->
          <div class="card month-picker">
            <button type="button" id="month-prev">Föregående</button>
            <h2 id="month-label"></h2>
            <button type="button" id="month-next">Nästa</button>
          </div>

          <!-- Summeringen står direkt under månadsväljaren, före listorna, så att
               den syns utan att man skrollar. Etiketterna är statisk text; app.js
               sätter bara textContent på de fyra beloppselementen, och talen
               kommer alltid ur svarets totals. -->
          <div class="card summary">
            <p class="summary-row">
              <span class="summary-label">Inkomster</span>
              <span class="summary-amount" id="total-income"></span>
            </p>
            <p class="summary-row">
              <span class="summary-label">Utgifter</span>
              <span class="summary-amount" id="total-expense"></span>
            </p>
            <p class="summary-row">
              <span class="summary-label">Sparande</span>
              <span class="summary-amount" id="total-saving"></span>
            </p>
            <p class="summary-row summary-left">
              <span class="summary-label">Kvar att leva på</span>
              <span class="summary-amount" id="total-left"></span>
            </p>
          </div>

          <!-- Formuläret öppnas av knapparna nedan och är inte alltid synligt.
               Samma formulär för ny post och för ändring. Slaget kommer från
               vilken lista knappen satt i och är därför inget fält. -->
          <section class="card" id="item-form-card" hidden>
            <form id="item-form" novalidate>
              <!-- Raden som säger vad som gäller i läget Bara <månad>. app.js
                   skriver texten och döljer raden i de andra lägena: i det här
                   läget bär kroppen bara amountSek, eftersom overrides varken
                   har en kolumn för namn eller för kategori. -->
              <p class="lead" id="month-only-note" hidden></p>

              <!-- Namn och kategori har ett eget id på sitt fältblock, så att
                   app.js kan dölja dem i läget Bara <månad>. Att dölja och inte
                   spärra: ett utgråat fält ser ut som något som kan låsas upp. -->
              <div class="field" id="name-field">
                <label for="item-name">Namn</label>
                <input id="item-name" name="name" type="text" autocomplete="off" />
                <p class="field-error" id="error-name" role="alert"></p>
              </div>

              <div class="field">
                <label for="item-amount">Belopp (kr)</label>
                <input id="item-amount" name="amountSek" type="text" inputmode="decimal" autocomplete="off" />
                <p class="field-error" id="error-amountSek" role="alert"></p>
              </div>

              <div class="field" id="category-field">
                <label for="item-category">Kategori</label>
                <!-- Alternativen fylls i av app.js ur CATEGORY_LABELS. Ingen
                     svensk kategorietikett skrivs för hand här. -->
                <select id="item-category" name="category"></select>
                <p class="field-error" id="error-category" role="alert"></p>
              </div>

              <!-- Återkommande [etapp 4]. Kryssrutan hör till DET HÄR formuläret
                   och inte till ett andra: samma formulär gäller en engångspost,
                   en mall och en ändring av en enda månad. De två fälten är
                   dolda tills rutan kryssas; app.js sätter hidden på
                   #recurring-fields och läser .checked. -->
              <div class="field field-checkbox" id="recurring-field">
                <label for="item-recurring">
                  <input id="item-recurring" name="recurring" type="checkbox" />
                  Återkommande
                </label>
              </div>

              <div id="recurring-fields" hidden>
                <div class="field">
                  <label for="item-interval">Intervall</label>
                  <!-- Alternativen fylls i av app.js ur INTERVAL_LABELS. Ingen
                       svensk intervalletikett skrivs för hand här. -->
                  <select id="item-interval" name="interval"></select>
                  <p class="field-error" id="error-interval" role="alert"></p>
                </div>

                <div class="field">
                  <label for="item-to-month">Till och med</label>
                  <!-- Valfritt: tomt betyder tills vidare. Formen prövas av
                       checkToMonth i src/core/item.js, som äger de två
                       texterna — inget mönster skrivs här. -->
                  <input id="item-to-month" name="toMonth" type="text" inputmode="numeric" autocomplete="off" />
                  <p class="field-error" id="error-toMonth" role="alert"></p>
                </div>
              </div>

              <p class="form-error" id="item-form-error" role="alert"></p>

              <button type="submit" class="primary" id="item-submit">Spara</button>
              <!-- Avbryt skickar inget anrop: den stänger formuläret, tömmer fälten
                   och rensar fältfelen. Utan den kan ett öppnat formulär bara
                   stängas genom att spara. -->
              <button type="button" class="secondary" id="item-cancel">Avbryt</button>
            </form>
          </section>

          <div class="lists">
            <section class="card">
              <h3>Inkomster</h3>
              <button type="button" class="add" id="add-income">+ Ny inkomst</button>
              <ul id="income-list" class="item-list"></ul>
              <p class="empty-state" id="income-empty"></p>
            </section>

            <section class="card">
              <h3>Utgifter</h3>
              <button type="button" class="add" id="add-expense">+ Ny utgift</button>
              <ul id="expense-list" class="item-list"></ul>
              <p class="empty-state" id="expense-empty"></p>
            </section>

            <section class="card">
              <h3>Sparande</h3>
              <button type="button" class="add" id="add-saving">+ Nytt sparande</button>
              <ul id="saving-list" class="item-list"></ul>
              <p class="empty-state" id="saving-empty"></p>
            </section>
          </div>

          <!-- Diagrammet: inline-SVG som app.js bygger, en stapel per kategori med
               utgift. Ingen bildfil, inget bibliotek, inget canvas. SVG:n bär
               role="img" och en title, så att den går att läsa med skärmläsare. -->
          <div class="card">
            <div id="chart" class="chart"></div>
            <p class="empty-state" id="chart-empty"></p>
          </div>

          <!-- Allmänna fel i månadsvyn: ett misslyckat GET och ett misslyckat
               DELETE. Formulärets egna svar skrivs i #item-form-error och vid
               fälten. -->
          <p class="form-error" id="month-error" role="alert"></p>
        </div>
      </section>
    </main>

    <!-- Demoläget. Filen laddas alltid och gör ingenting när DEMO i
         /demo/demolage.js är falsk — ingen annan fil under /demo/ hämtas då, och
         globalThis.fetch rörs inte. Är flaggan sann ersätter den fetch och ritar
         bannern, och den står därför FÖRE /app.js: ett modulskript med await på
         översta nivån fördröjer nästa modulskript, så app.js hinner inte anropa
         fetch innan attrappen är på plats. -->
    <script type="module" src="/demo/demo-fetch.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>

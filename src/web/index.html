<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hemochekonomi</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Hemochekonomi</h1>
      <p class="lead">Hemmets fasta utgifter och prenumerationer.</p>
    </header>

    <main>
      <!-- Paket 5: formulär och lista. Paket 6: kostnad per post, totalrutan
           och tomläget. Listan över kommande dragningar byggs i paket 7. -->
      <section class="card">
        <h2>Lägg till en utgift</h2>

        <form id="entry-form" novalidate>
          <div class="field">
            <label for="name">Namn</label>
            <input id="name" name="name" type="text" autocomplete="off" />
            <p class="field-error" id="error-name" role="alert"></p>
          </div>

          <div class="field">
            <label for="amountSek">Belopp per betalning (kr)</label>
            <input id="amountSek" name="amountSek" type="text" inputmode="decimal" autocomplete="off" />
            <p class="field-error" id="error-amountSek" role="alert"></p>
          </div>

          <div class="field">
            <label for="interval">Betalningsintervall</label>
            <!-- Alternativen fylls i av app.js ur INTERVAL_LABELS. Ingen svensk
                 etikett för intervall eller kategori skrivs för hand här. -->
            <select id="interval" name="interval"></select>
            <p class="field-error" id="error-interval" role="alert"></p>
          </div>

          <div class="field">
            <label for="startDate">Startdatum</label>
            <input id="startDate" name="startDate" type="date" />
            <p class="field-error" id="error-startDate" role="alert"></p>
          </div>

          <div class="field">
            <label for="category">Kategori</label>
            <select id="category" name="category"></select>
            <p class="field-error" id="error-category" role="alert"></p>
          </div>

          <p class="form-error" id="form-error" role="alert"></p>

          <button type="submit" class="primary">Spara</button>
        </form>
      </section>

      <section class="card">
        <h2>Dina poster</h2>
        <ul id="entry-list" class="entry-list"></ul>
        <!-- Tomläget. Texten skrivs av app.js och töms när listan har poster;
             ett tomt textContent syns inte, samma teknik som #form-error. -->
        <p class="empty-state" id="empty-state"></p>
      </section>

      <!-- Totalrutan står efter listan: den sammanfattar den och läses efter
           den. Etiketterna är statisk text och skrivs aldrig av app.js, som bara
           sätter textContent på de två beloppselementen. -->
      <section class="card">
        <h2>Summa</h2>
        <p class="total-row">
          <span class="total-label">Totalt per månad</span>
          <span class="total-amount" id="total-monthly"></span>
        </p>
        <p class="total-row">
          <span class="total-label">Totalt per år</span>
          <span class="total-amount" id="total-yearly"></span>
        </p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>

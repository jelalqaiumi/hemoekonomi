<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotypsymbolen for ljus bakgrund. Hus, mynt och stapel, utan gradienter och
  utan skuggor: den ska lasas ned till 32 bildpunkter, och en gradient blir en
  grot vid den storleken. Den ar en forenkling av src/web/bilder/logga.png, inte
  en kopia av den.

  Fargerna star som attribut och inte som var(): filen laddas ocksa som favicon,
  och en favicon arver inga tokens fran sidan. Varje varde ar en ton ur
  tema.css. Myntets K ar ritat i --bla-marin och inte i vitt: vitt pa --guld ger
  2,83:1 och forsvinner vid 32 bildpunkter, medan --bla-marin pa --guld ger
  4,71:1.

  Den morka varianten ligger i symbol-mork.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="symbol-titel">
  <title id="symbol-titel">Hem och Ekonomi</title>

  <!-- Huset: tak, vagg och fonster. -->
  <path d="M4 22 15 12l11 10z" fill="#248038" />
  <path d="M8 22h14v16H8z" fill="#0b6a3b" />
  <path d="M13 28h4v10h-4z" fill="#f7f5ef" />

  <!-- Stapeln: tva staplar som stiger. -->
  <path d="M29 28h5v10h-5z" fill="#0069b7" />
  <path d="M36 20h5v18h-5z" fill="#014085" />

  <!-- Myntet, framfor stapeln precis som i loggan. -->
  <circle cx="33" cy="13" r="8" fill="#e28202" />
  <circle cx="33" cy="13" r="8" fill="none" stroke="#d16c01" stroke-width="2" />
  <path
    d="M30.6 9.2v7.6M35.8 9.2 31.8 13l4 3.8"
    fill="none"
    stroke="#022d68"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

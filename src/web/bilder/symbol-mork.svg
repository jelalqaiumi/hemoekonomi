<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotypsymbolen for mork bakgrund. Samma former som symbol.svg, ljusare toner.

  Skalet ar matt. Mot --bla-marin (#022d68), som ar sidfotens och det morka
  lagets bakgrund, ger loggans egna toner: --gron-primar 1,99:1,
  --gron-djup 1,62:1, --gron-ljus 2,67:1, --bla-primar 1,31:1,
  --bla-mellan 1,70:1 och --bla-ljus 2,35:1. Ingen av dem nar 3:1, alltsa
  granssen for grafik, och den morka varianten kan darfor inte anvanda dem.

  De fyra ljusare tonerna nedan ar samma varden som --ikon-gron-ljus-pa-mork,
  --ikon-gron-pa-mork, --ikon-bla-ljus-pa-mork och --ikon-bla-pa-mork i
  tema.css, sa den inline-symbol sidfoten ritar ser likadan ut som den har
  filen. Uppmatt mot --bla-marin: tak 8,55:1, vagg 6,46:1, kort stapel 9,35:1,
  hog stapel 7,08:1 och myntet 4,71:1.

  Fonstret och myntets K ar ritade i --bla-marin, alltsa i bakgrundens egen ton,
  sa att de laser som hal i formen oavsett vilken mork yta symbolen star pa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="symbol-mork-titel">
  <title id="symbol-mork-titel">Hem och Ekonomi</title>

  <!-- Huset: tak, vagg och fonster. -->
  <path d="M4 22 15 12l11 10z" fill="#8fe0b5" />
  <path d="M8 22h14v16H8z" fill="#5cc98d" />
  <path d="M13 28h4v10h-4z" fill="#022d68" />

  <!-- Stapeln: tva staplar som stiger. -->
  <path d="M29 28h5v10h-5z" fill="#bcdcfa" />
  <path d="M36 20h5v18h-5z" fill="#8fc2f2" />

  <!-- Myntet, framfor stapeln precis som i loggan. -->
  <circle cx="33" cy="13" r="8" fill="#e28202" />
  <circle cx="33" cy="13" r="8" fill="none" stroke="#d16c01" stroke-width="2" />
  <path
    d="M30.6 9.2v7.6M35.8 9.2 31.8 13l4 3.8"
    fill="none"
    stroke="#022d68"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
